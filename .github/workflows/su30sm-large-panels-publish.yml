name: Su30SM large facets on both photographed sides
on:
  push:
    branches: [fix/su30sm-large-panels-20261113]
    paths: [.github/workflows/su30sm-large-panels-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-large-panels
            changes/su30sm-local-skin
            dist/su30sm-large-panels
            reports/su30sm-large-panels
      - name: Download the exact previous separate architecture archives
        run: |
          mkdir -p work/previous-zips
          curl -fLsS --retry 3 https://github.com/i7885784-lang/igraYS-Flight-Simulator/releases/download/su30sm-ordered-facets-20261113/Su30SM_OrderedFacets_Windows_x86.zip -o work/previous-zips/Su30SM_OrderedFacets_Windows_x86.zip
          curl -fLsS --retry 3 https://github.com/i7885784-lang/igraYS-Flight-Simulator/releases/download/su30sm-ordered-facets-20261113/Su30SM_OrderedFacets_Windows_x64.zip -o work/previous-zips/Su30SM_OrderedFacets_Windows_x64.zip
      - name: Install existing parser dependency
        run: python -m pip install Pillow
      - name: Assemble frozen four-PCK patches and check both architectures
        run: python changes/su30sm-large-panels/package.py work/packages work/previous-zips
      - name: Publish the new visually checked version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create su30sm-large-panels-20261113
          --repo i7885784-lang/igraYS-Flight-Simulator
          --target "${{ github.sha }}"
          --prerelease
          --title "Су-30СМ: крупные грани обеих сторон и створок"
          --notes-file reports/su30sm-large-panels/RELEASE.md
      - name: Upload separate games and corresponding model sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload su30sm-large-panels-20261113
          work/packages/Su30SM_LargePanels_Windows_x86.zip
          work/packages/Su30SM_LargePanels_Windows_x64.zip
          work/packages/Su30SM_LargePanels_ModelSources.zip
          work/packages/SHA256SUMS.txt
          work/packages/packages.json
          --repo i7885784-lang/igraYS-Flight-Simulator
