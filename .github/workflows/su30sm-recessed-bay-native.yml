name: Su30SM connected main bay door native Windows x86 and x64
on:
  push:
    branches: [fix/su30sm-recessed-bay-20261114]
    paths: [.github/workflows/su30sm-recessed-bay-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-recessed-bay
            changes/su30sm-local-skin/model-source
            dist/su30sm-recessed-bay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Restore genuine architecture and apply exact model patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python changes/su30sm-recessed-bay/windows_prepare.py ${{ matrix.bits }}
      - name: Launch actual Windows game and capture gear
        run: python changes/su30sm-recessed-bay/windows_check.py ${{ matrix.bits }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Su30SM-RecessedBay-native-${{ matrix.bits }}
          path: |
            native-${{ matrix.bits }}/*.png
            native-${{ matrix.bits }}/results.json
          retention-days: 30
