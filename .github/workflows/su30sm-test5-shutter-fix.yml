name: Su30SM test5 two shutter geometry fix
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-test5-shutter-fix
            reports/su30sm-test5-shutter-fix
            reports/su30sm-test5-intake-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r changes/su30sm-test5-shutter-fix/requirements.txt
      - run: python changes/su30sm-test5-shutter-fix/deliver.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
