name: Publish Su30SM actual nozzle videos
on:
  push:
    branches: [evidence/su30sm-nozzles-20261114]
    paths: [.github/workflows/su30sm-nozzle-video-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reports/su30sm-nozzle-video
      - name: Check exact recorded videos
        working-directory: reports/su30sm-nozzle-video
        run: sha256sum -c SHA256SUMS.txt
      - name: Add videos to the matching preserved CockpitFit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload su30sm-cockpit-fit-20261114 reports/su30sm-nozzle-video/Su30SM_Nozzle_Opening.mp4 reports/su30sm-nozzle-video/Su30SM_Nozzle_Control_Check.mp4 --repo i7885784-lang/igraYS-Flight-Simulator
