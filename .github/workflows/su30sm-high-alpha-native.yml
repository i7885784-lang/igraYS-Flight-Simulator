name: Build and fly Su30SM high alpha on real Windows x86 and x64
on:
  push:
    branches: [fix/su30sm-high-alpha-20261115]
    paths: [.github/workflows/su30sm-high-alpha-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bits: [32,64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-high-alpha
            changes/su30sm-nozzle-vector
            dist/su30sm-nozzle-vector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ g++-mingw-w64-i686-posix g++-mingw-w64-x86-64-posix
      - run: python changes/su30sm-high-alpha/build_candidate.py ${{ matrix.bits }}
      - uses: actions/upload-artifact@v4
        with:
          name: Su30SM-HighAlpha-build-${{ matrix.bits }}
          path: work/built/*
          retention-days: 30
  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bits: [32,64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-high-alpha
            changes/su30sm-nozzle-vector
            dist/su30sm-nozzle-vector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: Su30SM-HighAlpha-build-${{ matrix.bits }}
          path: work/built
      - name: Fly actual 600 kmh entry, enable limiter override, recover and restore normal controls
        run: python changes/su30sm-high-alpha/check_native.py ${{ matrix.bits }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Su30SM-HighAlpha-native-${{ matrix.bits }}
          path: |
            native-${{ matrix.bits }}/*.png
            native-${{ matrix.bits }}/results.json
          retention-days: 30
