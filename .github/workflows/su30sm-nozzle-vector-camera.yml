name: Inspect Su30SM nozzle rear camera using already tested x64 binary
on:
  push:
    branches: [fix/su30sm-nozzle-vectoring-20261114]
    paths: [.github/workflows/su30sm-nozzle-vector-camera.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rear-camera:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-nozzle-vector
            dist/su30sm-nozzle-vector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: Su30SM-VectorNozzles-build-64
          path: work/built
          run-id: 43676877534
          github-token: ${{ github.token }}
      - run: python changes/su30sm-nozzle-vector/windows_prepare.py 64
      - name: Capture missing rear views without rebuilding or repeating live control tests
        env:
          STATIC_ONLY: "1"
        run: python changes/su30sm-nozzle-vector/windows_check.py 64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Su30SM-VectorNozzles-static-64
          path: |
            native-64/*.png
            native-64/results.json
          retention-days: 30
