name: Su30SM rear seams quick separate builds
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-rear-seams
            reports/su30sm-black-wells
      - run: python changes/su30sm-rear-seams/deliver.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
