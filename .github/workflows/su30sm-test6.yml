name: Su-30SM test 6 delivery
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release ID
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/aircraft-su30sm-test6
            reports/su30sm-test-5
            reports/su30sm-test-6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r changes/aircraft-su30sm-test6/requirements.txt
      - run: python changes/aircraft-su30sm-test6/deliver.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: su30sm-test6-status
          path: reports/su30sm-test-6/STATUS.json
  windows32:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/aircraft-su30sm-test6
      - run: python changes/aircraft-su30sm-test6/windows_check.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: su30sm-test6-windows32
          path: windows-evidence
