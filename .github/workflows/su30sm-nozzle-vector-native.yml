name: Build and run Su30SM vector nozzles on Windows x86 and x64
on:
  push:
    branches: [fix/su30sm-nozzle-vectoring-20261114]
    paths: [.github/workflows/su30sm-nozzle-vector-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bits: [32,64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-nozzle-vector
            changes/su30sm-local-skin/model-source
            dist/su30sm-nozzle-vector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ g++-mingw-w64-i686-posix g++-mingw-w64-x86-64-posix
      - run: python -m pip install -r changes/su30sm-nozzle-vector/requirements.txt
      - name: Compile real architecture from complete guarded engine sources
        run: python changes/su30sm-nozzle-vector/prepare.py ${{ matrix.bits }}
      - uses: actions/upload-artifact@v4
        with:
          name: Su30SM-VectorNozzles-build-${{ matrix.bits }}
          path: work/built/*
          retention-days: 30
  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        bits: [32,64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-nozzle-vector
            dist/su30sm-nozzle-vector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: Su30SM-VectorNozzles-build-${{ matrix.bits }}
          path: work/built
      - run: python changes/su30sm-nozzle-vector/windows_prepare.py ${{ matrix.bits }}
      - name: Launch actual game and exercise nozzles and gear
        run: python changes/su30sm-nozzle-vector/windows_check.py ${{ matrix.bits }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Su30SM-VectorNozzles-native-${{ matrix.bits }}
          path: |
            native-${{ matrix.bits }}/*.png
            native-${{ matrix.bits }}/results.json
          retention-days: 30
