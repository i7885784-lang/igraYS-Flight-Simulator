name: Su30SM intake artifact geometry-only delivery
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-intake-artifacts
            reports/su30sm-intake-artifacts
            reports/su30sm-visual-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r changes/su30sm-intake-artifacts/requirements.txt
      - run: python changes/su30sm-intake-artifacts/deliver.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
