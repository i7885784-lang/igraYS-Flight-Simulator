name: Publish checked Su30SM cockpit repair
on:
  push:
    branches: [fix/su30sm-cockpit-fit-20261114]
    paths: [.github/workflows/su30sm-cockpit-fit-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            changes/su30sm-cockpit-fit
            changes/su30sm-local-skin
            dist/su30sm-cockpit-fit
            reports/su30sm-cockpit-fit
      - name: Download previous genuine separate architectures
        run: |
          mkdir -p work/previous
          curl -fLsS --retry 3 https://github.com/i7885784-lang/igraYS-Flight-Simulator/releases/download/su30sm-confirmed-defects-20261114/Su30SM_LocalDefects_Windows_x86.zip -o work/previous/Su30SM_LocalDefects_Windows_x86.zip
          curl -fLsS --retry 3 https://github.com/i7885784-lang/igraYS-Flight-Simulator/releases/download/su30sm-confirmed-defects-20261114/Su30SM_LocalDefects_Windows_x64.zip -o work/previous/Su30SM_LocalDefects_Windows_x64.zip
      - run: python -m pip install Pillow
      - name: Package only native verified models and check PE CRC and resources
        env:
          REQUIRE_NATIVE_CHECKS: "1"
        run: python changes/su30sm-cockpit-fit/package.py work/packages work/previous
      - name: Publish games model sources screenshots and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create su30sm-cockpit-fit-20261114 --repo i7885784-lang/igraYS-Flight-Simulator --target "${{ github.sha }}" --prerelease --title "Су-30СМ: подогнанная панель и замкнутый интерьер кабины" --notes-file reports/su30sm-cockpit-fit/RELEASE.md
          gh release upload su30sm-cockpit-fit-20261114 work/packages/Su30SM_CockpitFit_Windows_x86.zip work/packages/Su30SM_CockpitFit_Windows_x64.zip work/packages/Su30SM_CockpitFit_ModelSources.zip work/packages/SHA256SUMS.txt work/packages/packages.json reports/su30sm-cockpit-fit/Su30SM_CockpitFit_VisualReport.zip reports/su30sm-cockpit-fit/before.png reports/su30sm-cockpit-fit/after.png reports/su30sm-cockpit-fit/rear-before.png reports/su30sm-cockpit-fit/rear-after.png --repo i7885784-lang/igraYS-Flight-Simulator
