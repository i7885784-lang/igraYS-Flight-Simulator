name: Su30SM Test5 targeted visual polish delivery
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-visual-polish
            reports/su30sm-visual-polish
            reports/su30sm-gear-bays-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r changes/su30sm-visual-polish/requirements.txt
      - run: python changes/su30sm-visual-polish/deliver.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
