name: Build personal Su-27 and Su-34 test 7
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-test7
  cancel-in-progress: false
jobs:
  private-test:
    if: github.repository == 'i7885784-lang/igraYS-Flight-Simulator'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su27-personal-test7
            changes/su34-private-converter
            reports/personal-playtest-7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r changes/su27-personal-test7/requirements.txt
      - name: Reproduce reviewed Su-34 and verify private ZIP downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '427079833'
          OPENBLAS_NUM_THREADS: '1'
        run: python changes/su27-personal-test7/build_draft.py
      - name: Save verification and owner download links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/personal-playtest-7/STATUS.json
          git commit -m 'Record verified personal Su-27 and Su-34 test 7 downloads'
          git pull --rebase origin ysflight-center-download
          git push origin HEAD:ysflight-center-download
