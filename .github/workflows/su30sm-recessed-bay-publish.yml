name: Publish checked Su30SM main bay repair
on:
  push:
    branches: [fix/su30sm-recessed-bay-20261114]
    paths: [.github/workflows/su30sm-recessed-bay-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            changes/su30sm-recessed-bay
            changes/su30sm-local-skin
            dist/su30sm-recessed-bay
            reports/su30sm-recessed-bay
      - name: Download exact accepted separate architectures
        run: |
          mkdir -p work/previous
          curl -fLsS --retry 3 https://github.com/i7885784-lang/igraYS-Flight-Simulator/releases/download/su30sm-cockpit-fit-20261114/Su30SM_CockpitFit_Windows_x86.zip -o work/previous/Su30SM_CockpitFit_Windows_x86.zip
          curl -fLsS --retry 3 https://github.com/i7885784-lang/igraYS-Flight-Simulator/releases/download/su30sm-cockpit-fit-20261114/Su30SM_CockpitFit_Windows_x64.zip -o work/previous/Su30SM_CockpitFit_Windows_x64.zip
      - run: python -m pip install Pillow
      - name: Package native verified model and check both PE CRC and resources
        run: python changes/su30sm-recessed-bay/package.py work/packages work/previous
      - name: Publish games model sources screenshots and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create su30sm-recessed-bay-20261114 --repo i7885784-lang/igraYS-Flight-Simulator --target "${{ github.sha }}" --prerelease --title "Су-30СМ: устранён неподвижный выступ у основной ниши" --notes-file reports/su30sm-recessed-bay/RELEASE.md
          gh release upload su30sm-recessed-bay-20261114 work/packages/Su30SM_RecessedBay_Windows_x86.zip work/packages/Su30SM_RecessedBay_Windows_x64.zip work/packages/Su30SM_RecessedBay_ModelSources.zip work/packages/SHA256SUMS.txt work/packages/packages.json reports/su30sm-recessed-bay/Su30SM_RecessedBay_VisualReport.zip reports/su30sm-recessed-bay/open-comparison.png reports/su30sm-recessed-bay/closed-comparison.png reports/su30sm-recessed-bay/before-open.png reports/su30sm-recessed-bay/after-open.png reports/su30sm-recessed-bay/gear-cycle.mp4 --repo i7885784-lang/igraYS-Flight-Simulator
