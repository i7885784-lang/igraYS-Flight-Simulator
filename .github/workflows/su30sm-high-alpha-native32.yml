name: Recheck high-alpha x86 input with existing built executable
on:
  push:
    branches: [fix/su30sm-high-alpha-20261115]
    paths: [.github/workflows/su30sm-high-alpha-native32.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native32:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes/su30sm-high-alpha
            changes/su30sm-nozzle-vector
            dist/su30sm-nozzle-vector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: Su30SM-HighAlpha-build-32
          path: work/built
          run-id: 43687813404
          github-token: ${{ github.token }}
      - run: python changes/su30sm-high-alpha/check_native.py 32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Su30SM-HighAlpha-native-32
          path: |
            native-32/*.png
            native-32/results.json
          retention-days: 30

# Use lightweight field for software-rendered x86 input sampling.
